name: Build Aether Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Verify standalone namespace
        run: |
          if grep -R -n -E 'dev\.lowspec\.rendercore|lowspec_rendercore' src; then
            echo "Found a leftover LowSpec RenderCore dependency."
            exit 1
          fi
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: aether-engine
          path: build/libs/*.jar
